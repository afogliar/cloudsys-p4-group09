services:
  api:
    build:
      context: ./api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /openapi.json is unauthenticated and proves uvicorn + the ASGI app
      # are serving (the /v1/* routes themselves require a device token).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      models-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully

  # One-shot initialisation chain: db-init -> models-init -> data-init.
  # `docker compose up -d` yields a fully initialised system with no manual
  # step; each job exits 0 and is skipped on subsequent invocations unless
  # its configuration changes.
  db-init:
    build:
      context: ./api
    env_file:
      - .env
    command:
      - python
      - -c
      - "from app.database import initialize_database; from app.models import initialize_model_tables; initialize_database(); initialize_model_tables(); print('db-init: PostgreSQL tables ready')"
    depends_on:
      postgres:
        condition: service_healthy

  models-init:
    build:
      context: ./api
    env_file:
      - .env
    command: ["python", "-m", "app.models", "--kit-root", "/kit"]
    volumes:
      - type: bind
        # Kit source overridable for a standalone cloud VM (P4_KIT_DIR in
        # .env); the default keeps the sibling-checkout dev layout working.
        source: ${P4_KIT_DIR:-../../cloudsys-p4-students-main/kit}
        target: /kit
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  data-init:
    build:
      context: ./api
    env_file:
      - .env
    command: ["python", "-m", "app.data_init", "--data-dir", "/data", "--kit-root", "/kit"]
    volumes:
      - type: bind
        source: ${P4_DATA_DIR:-../../cloudsys-p4-students-main/data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${P4_KIT_DIR:-../../cloudsys-p4-students-main/kit}
        target: /kit
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      models-init:
        condition: service_completed_successfully

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
      target: runtime
      additional_contexts:
        # Course repo checkout supplying kit/ and data/ baked into the image.
        # Override P4_COURSE_DIR on a standalone cloud VM (see .env.example).
        materials: ${P4_COURSE_DIR:-../../cloudsys-p4-students-main}
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_HTTP_REQUEST_TIMEOUT: "15"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
    volumes:
      - trainer_state:/state
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mlflow:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      models-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully

  mlflow:
    build:
      context: ./mlflow
    env_file:
      - .env
    environment:
      MLFLOW_ALLOWED_HOSTS: "mlflow:*,localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    build:
      context: ./minio
    image: p4-group09-minio:2025-10-15
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  trainer_state:
